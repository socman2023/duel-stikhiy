/* v0.5.2 — счёт дуэлей: всегда виден рядом с соперниками. */
.live-stats{border-top:1px solid #4c5060;margin-top:16px;padding-top:14px}
.live-stats h3{font-family:Georgia,serif;font-weight:400;font-size:17px;color:#ebd9b8;margin:0 0 10px}
.live-stats table,.result-duel-stats table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.live-stats th,.live-stats td{padding:7px 4px;border-bottom:1px solid #40465a;font-size:11px;text-align:center}
.live-stats thead th{color:#c9b27e;font-size:10px}
.live-stats th:first-child{text-align:left}
.live-stats td{color:#ebe8e4;font-weight:700}
.live-stats tbody tr.is-human th{color:#f6d99c}
.live-stats p{font-size:10px;color:#9da5b7;margin:9px 0 0}
.result-duel-stats{margin:22px 0;text-align:left;border:1px solid #494c5d;padding:14px;border-radius:10px;overflow-x:auto}
.result-duel-stats h2{font:400 20px Georgia,serif;color:#ecd3a7;margin:0 0 10px}
.result-duel-stats th,.result-duel-stats td{padding:7px 6px;border-bottom:1px solid #40465a;font-size:11px;text-align:center;white-space:nowrap}
.result-duel-stats th:first-child{text-align:left}
.result-duel-stats thead th{color:#e5c992;font-size:10px}
/* Право перехода к добору принадлежит только пользователю, поэтому кнопку выделяем. */
.draw-actions .primary-button{min-height:46px;font-size:14px}
@media(max-width:880px){.live-stats{padding-top:11px;margin-top:11px}.live-stats h3{font-size:15px}.live-stats table{max-width:540px}.live-stats th,.live-stats td{padding:5px 3px;font-size:10px}}
